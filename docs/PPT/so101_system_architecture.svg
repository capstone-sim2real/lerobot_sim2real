      <stop offset="0" stop-color="#F3FCFC"/><stop offset="1" stop-color="#DDF5F3"/>
    </linearGradient>
    <linearGradient id="runnerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FAFF"/><stop offset="1" stop-color="#E2F0FC"/>
    </linearGradient>
