    <style>
      text { font-family: 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif; fill: #193B59; }
      .boundaryLabel { font-size: 18px; font-weight: 800; letter-spacing: 1.4px; fill: #496A83; }
      .command { font-size: 29px; font-weight: 800; letter-spacing: -0.4px; }
      .role { font-size: 17px; font-weight: 600; fill: #628097; }
      .heading { font-size: 23px; font-weight: 800; }
      .body { font-size: 16px; font-weight: 500; fill: #5F788E; }
      .taskName { font-size: 17px; font-weight: 800; fill: #255D87; }
      .label { font-size: 14px; font-weight: 700; fill: #5E778C; }
