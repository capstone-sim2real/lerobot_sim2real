[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pick-stack"
version = "0.1.0"
description = "SO-101 CV+IK pick-and-place FSM"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
hardware = [
    "lerobot[feetech,kinematics]",
]
# Task 3 dataset recording. A full `uv sync` can replace the JetPack torch
# wheel (the only one built for the Orin), so install these with
# `uv pip install` rather than syncing the extra.
collect = [
    "datasets>=4.7.0,<5.0.0",
    "av>=15.0.0,<16.0.0",
]
# LLM tool-calling agent (so101-agent). Same rule as `collect`: install with
# `uv pip install` (see README), never `uv sync --extra`, so the JetPack torch
# wheel is left alone. `agent` itself needs no LLM SDK; install the SDK extras
# for both agent.provider and agent.fallback_provider (configs/default.yaml).
agent = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "ruckig==0.19.4",
]
agent-anthropic = [
    "anthropic>=0.40",
]
agent-openai = [
    "openai>=1.60",
]
agent-gemini = [
    "google-genai>=1.0",
]

[project.scripts]
so101-run = "runners.run_task:main"
so101-collect = "runners.run_task3:main"
so101-agent = "agent.server:main"
so101-panel = "agent.panel:main"
so101-camera = "camera.server:main"
so101-detect = "tools.hardware.view_detect:main"
so101-calibrate = "tools.calibration.calibrate_homography:main"
so101-zone-calibrate = "tools.calibration.calibrate_zone:main"
so101-robot-calibrate = "tools.calibration.calibrate_robot:main"
so101-scan-motors = "tools.hardware.scan_motors:main"
so101-fk = "tools.hardware.fk_probe:main"
so101-gripper = "tools.hardware.gripper_probe:main"
so101-gripper-move = "tools.hardware.gripper_move_probe:main"
so101-ik = "tools.hardware.ik_move:main"
so101-keyboard = "tools.hardware.keyboard_control:main"
so101-record-calibration-point = "tools.calibration.record_calibration_point:main"
so101-capture-calibration-point = "tools.calibration.capture_calibration_point:main"
so101-torque-off = "tools.hardware.torque_off:main"
so101-teleop-session = "tools.calibration.teleop_session:main"
so101-capture-teleop-points = "tools.calibration.capture_teleop_points:main"
so101-live-fk = "tools.hardware.live_fk_overlay:main"

# Session tools: existing calibration commands remain supported.
[tool.uv.sources]
lerobot = { path = "third_party/lerobot", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
agent = ["web/*.html", "web/*.css", "web/*.js"]
camera = ["*.js"]
