[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pick-stack"
version = "0.1.0"
description = "SO-101 CV+IK pick-and-place FSM"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
hardware = [
    "lerobot[feetech,kinematics]",
]
# Task 3 dataset recording. Installed deliberately narrowly: a full
# `uv sync` can replace the JetPack torch wheel, which is the only one
# built for the Orin (docs/guide/SO101_데이터수집_관리.md §2), so install
# these two with `uv pip install` rather than syncing the extra.
collect = [
    "datasets>=4.7.0,<5.0.0",
    "av>=15.0.0,<16.0.0",
]

[project.scripts]
so101-run = "runners.run_task:main"
so101-collect = "runners.run_task3:main"
so101-camera = "camera.server:main"
so101-detect = "tools.view_detect:main"
so101-calibrate = "tools.calibrate_homography:main"
so101-zone-calibrate = "tools.calibrate_zone:main"
so101-robot-calibrate = "tools.calibrate_robot:main"
so101-scan-motors = "tools.scan_motors:main"
so101-fk = "tools.fk_probe:main"
so101-gripper = "tools.gripper_probe:main"
so101-gripper-move = "tools.gripper_move_probe:main"
so101-ik = "tools.ik_move:main"
so101-keyboard = "tools.keyboard_control:main"
so101-record-calibration-point = "tools.record_calibration_point:main"
so101-capture-calibration-point = "tools.capture_calibration_point:main"
so101-torque-off = "tools.torque_off:main"
so101-teleop-session = "tools.teleop_session:main"
so101-capture-teleop-points = "tools.capture_teleop_points:main"
so101-live-fk = "tools.live_fk_overlay:main"

# Session tools: existing calibration commands remain supported.
[tool.uv.sources]
lerobot = { path = "third_party/lerobot", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
