<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수집 에피소드 · SO-101</title>
<script>
(() => { let mode; try { mode=localStorage.getItem("so101-theme"); } catch (_) {}
const dark=mode==="dark"||(mode!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.classList.toggle("dark",dark);
document.documentElement.style.colorScheme=dark?"dark":"light"; })();
</script>
<link rel="stylesheet" href="/shadcn.css"><link rel="stylesheet" href="/episodes.css">
</head><body class="bg-background text-foreground">
<header class="episode-top border bg-card text-card-foreground">
  <a href="/" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2" data-slot="button" data-variant="outline">← 로봇 제어 화면</a>
  <h1>수집 에피소드</h1>
  <button id="refresh" type="button" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2" data-slot="button" data-variant="outline">새로고침</button>
</header>
<main class="episode-layout">
  <section class="rounded-xl border bg-card py-6 text-card-foreground shadow-sm episode-card" data-slot="card">
    <h2>데이터셋</h2><label for="run-select">수집 실행</label>
    <select id="run-select" class="episode-select border bg-background text-foreground" data-slot="select-trigger"></select>
    <div id="run-detail" class="text-muted-foreground episode-detail"></div>
  </section>
  <section class="rounded-xl border bg-card py-6 text-card-foreground shadow-sm episode-card" data-slot="card">
    <h2>에피소드 <span id="episode-count"></span></h2>
    <div id="episode-list" class="episode-list"></div>
  </section>
  <section class="rounded-xl border bg-card py-6 text-card-foreground shadow-sm episode-card" data-slot="card">
    <h2 id="episode-title">에피소드를 선택하세요</h2>
    <p id="episode-detail" class="text-muted-foreground episode-detail"></p>
    <div id="episode-videos" class="episode-video-row"></div>
  </section>
</main><script src="/episodes.js"></script>
</body></html>
