<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수집 에피소드 · SO-101</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/shadcn.css"><style>
.episode-layout{max-width:1400px;margin:auto;padding:24px;display:grid;grid-template-columns:280px 320px minmax(0,1fr);gap:18px}.episode-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.episode-list{display:grid;gap:8px;max-height:70vh;overflow:auto}.episode-item{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;padding:10px;cursor:pointer}.episode-item[aria-current=true]{border-color:#3b82f6;background:#3b82f622}.episode-muted{color:var(--muted);font-size:13px}.episode-video{width:100%;max-height:60vh;background:#111;border-radius:8px}.episode-video-row{display:grid;gap:14px}.episode-video-row video{width:100%}.episode-top{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--line)}.episode-top a{color:inherit}.episode-select{width:100%;margin:8px 0 16px}.episode-empty{padding:18px;color:var(--muted)}@media(max-width:900px){.episode-layout{grid-template-columns:1fr}.episode-list{max-height:250px}}
</style></head><body><header class="episode-top"><a href="/">← 로봇 제어 화면</a><strong>수집 에피소드</strong><button id="refresh" type="button" class="btn">새로고침</button></header><main class="episode-layout"><section class="episode-card"><h2>데이터셋</h2><label for="run-select">수집 실행</label><select id="run-select" class="episode-select"></select><div id="run-detail" class="episode-muted"></div></section><section class="episode-card"><h2>에피소드 <span id="episode-count"></span></h2><div id="episode-list" class="episode-list"></div></section><section class="episode-card"><h2 id="episode-title">에피소드를 선택하세요</h2><p id="episode-detail" class="episode-muted"></p><div id="episode-videos" class="episode-video-row"></div></section></main><script src="/episodes.js"></script></body></html>
