# pick_stack default configuration.
# Every key mirrors a dataclass field in pick_stack/config.py — unknown keys
# are rejected at load time. Override at runtime with --set key.path=value.

robot:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6086462-if00
  id: my_follower
  max_relative_target: 10.0
  disable_torque_on_disconnect: false
  cameras:
    top:
      index_or_path: /dev/video0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
    wrist:
      index_or_path: /dev/video2
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG

perception:
  calibration_path: src/pick_stack/configs/calib/venue_default.json
  top_camera_key: top
  square_mm: 25.0        # 실제 체스판 한 칸 길이 실측 후 수정
  min_pattern: [5, 5]
  rectified_mm_per_px: 1.0
  # 합성 픽스처 기준값 — 실프레임으로 tools/view_detect.py 돌려서 재튜닝 필수
  hsv_ranges:
    red: [[0, 90, 60, 8, 255, 255], [172, 90, 60, 179, 255, 255]]
    yellow: [[26, 90, 80, 34, 255, 255]]
    green: [[40, 60, 50, 85, 255, 255]]
    blue: [[95, 90, 50, 130, 255, 255]]
    wood: [[10, 40, 80, 25, 180, 255]]
  area_mm2_min: 900.0
  area_mm2_max: 2600.0
  aspect_ratio_max: 1.6
  solidity_min: 0.85
  fill_min: 0.65
  morph_kernel_px: 5

select:
  rule: nearest_first
  zone_margin_mm: 20.0
  target_cell_mm: 40.0

sensing:
  # 실측 전 가정값 — tools/tune_gripper_load.py로 분포 찍고 재설정 필수
  gripper_open_pos: 50.0     # 텔레옵 녹화 컨벤션의 open width와 일치시킬 것
  gripper_close_pos: 2.0
  gripper_empty_closed_max: 6.0
  gripper_load_min: 120.0
  grasp_check_mode: position_and_load
  grasp_settle_s: 0.4
  grasp_samples: 5
  sample_interval_s: 0.05
  contact_joints: [shoulder_lift, elbow_flex]
  contact_load_delta: 80.0
  contact_baseline_samples: 5

motion:
  poses_path: src/pick_stack/configs/poses.yaml
  fps: 30.0
  max_step_per_tick: 2.0
  descent_step_per_tick: 0.6
  arrival_tol: 3.0
  move_timeout_s: 10.0
  gripper_action_wait_s: 0.6
  home_pose: home
  retreat_pose: retreat
  transport_waypoints: [zone_approach]
  slot_poses: [slot_0, slot_1, slot_2, slot_3, slot_4]
  tower_approach_pose: tower_approach
  tower_ladder_prefix: tower_descent
  contact_backoff_ticks: 1
  place_settle_s: 0.5

policy:
  server_address: 127.0.0.1:8080     # Tailscale의 policy_server 주소로 변경
  policy_type: act
  pretrained_name_or_path: ""        # policy_server가 도는 머신 기준 경로
  task: "Pick the nearest block, lift it vertically, and move to the fixed retreat pose."
  policy_device: cuda
  actions_per_chunk: 50
  chunk_size_threshold: 0.5
  aggregate_fn_name: weighted_average
  aggregate_weight: 0.5
  fps: 30.0
  connect_timeout_s: 5.0
  retreat_tol: 4.0
  retreat_hold_ticks: 5
  retreat_check_joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
  pick_timeout_s: 25.0

fsm:
  num_blocks: 5
  time_budget_s: 300.0
  max_retries_per_block: 2
  reserve_time_s: 10.0

logging:
  log_dir: logs/pick_stack
  save_transitions: true
