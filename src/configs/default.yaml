# pick_stack default configuration.
# Every key mirrors a dataclass field in pick_stack/config.py — unknown keys
# are rejected at load time. Override at runtime with --set key.path=value.

robot:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6086462-if00
  id: my_follower
  max_relative_target: 10.0
  disable_torque_on_disconnect: false
  cameras: {}

perception:
  calibration_path: src/configs/calib/venue_lab.json
  snapshot_url: http://127.0.0.1:8090/snapshot/shoulder.jpg
  square_mm: 25.0        # 실제 체스판 한 칸 길이 실측 후 수정
  min_pattern: [5, 5]
  rectified_mm_per_px: 1.0
  # HSV 밴드는 '분류'가 아니라 넉넉한 1차 후보 게이트다. 서로 겹쳐도 되고,
  # 실제로 겹쳐야 한다 — wood와 yellow는 어떤 고정 박스로도 안 갈린다.
  # 어두운 구석에 있을 땐 색상이 갈리고 채도는 안 갈리며, 밝은 판 위에선
  # 정확히 그 반대다(양쪽 다 실측). 최종 색 판정은 color_prototypes가 한다.
  hsv_ranges:
    red: [[0, 100, 55, 10, 255, 255], [170, 100, 55, 179, 255, 255]]
    yellow: [[13, 55, 50, 40, 255, 255]]
    green: [[35, 40, 30, 95, 255, 255]]
    blue: [[88, 40, 30, 136, 255, 255]]
    wood: [[3, 25, 40, 32, 120, 255]]
  # 색별 기준 (색상, 채도). 블록 내부 픽셀(테두리 침식 후, 색당 2~4.5만개)을
  # 어두운 배치와 밝은 배치 양쪽에서 실측한 값. 명도(V)는 일부러 뺐다 —
  # 위치에 따라 가장 많이 변하면서 정체성은 가장 적게 담는 채널이다.
  # 각 blob은 '어느 게이트에 걸렸나'가 아니라 '어느 기준에 가장 가까운가'로
  # 이름이 정해지고, 색마다 max_per_color개까지만 가져간다.
  # 색마다 (색상,채도) 점 '목록'이다. 어두운 구석과 밝은 판 위에서 같은 블록의
  # 채도가 완전히 다르게 측정되는데(yellow 실측 S가 65~200까지 흔들림), 한 점을
  # 평균으로 잡으면 실제 밝은 노랑이 자기 기준점보다 wood 기준점에 더 가까워지는
  # 문제가 생겼다. 그래서 yellow는 조명 상황별로 점을 2개 두고, 후보는 그 색의
  # 여러 점 중 가장 가까운 것과 비교한다.
  color_prototypes:
    red: [[2, 168]]
    yellow: [[23, 116], [26, 190]]
    green: [[72, 148]]
    blue: [[120, 137]]
    wood: [[17, 81]]
  prototype_hue_weight: 2.0
  prototype_saturation_weight: 1.0
  # 모든 기준색에서 이보다 멀면 어느 블록도 아니다. 이 상한이 없으면 남은 blob이
  # 비어 있는 색 슬롯에 강제 배정되어 없는 블록을 만들어낸다.
  # 실측 실제 블록 0.07~0.10, 가장 헷갈리는 쌍(wood-yellow)의 오답이 0.24.
  prototype_max_distance: 0.35
  area_mm2_min: 900.0
  # 고방위각에서는 카메라가 블록 측면까지 보므로 투영 blob이 ~2200mm2까지 부푼다
  area_mm2_max: 3200.0
  aspect_ratio_max: 1.6
  # 0.85가 아닌 이유: 방위각 ±75° 밖에서는 카메라가 블록 옆면까지 봐서 실루엣이
  # 진짜로 오목한 육각형이 된다. 30프레임 실측 최악값 0.847(+82° 파랑),
  # 나머지 색은 0.888 이상. 테이프/잡동사니는 여전히 0.55~0.72.
  solidity_min: 0.78
  fill_min: 0.65
  # 5가 아닌 9: 어두운 가장자리에서 마스크 테두리가 프레임마다 떨리며 blob에
  # 홈을 파는데, 이건 색이 아니라 '형상' 문제라 HSV를 풀면 오히려 악화된다.
  # OPEN을 넓히면 그 테두리가 깎여 나가고 안정된 코어만 남는다.
  # +82° 파랑 30프레임 실측 solidity 하한: k=5 0.691 -> k=7 0.802 -> k=9 0.847
  morph_kernel_px: 9
  # 경기장에 색상별 블록이 1개씩만 존재 — 색마다 최대 이 개수까지만. 0이면 무제한.
  max_per_color: 1
  # 이 거리보다 가까운 다른 색 후보는 '같은 블록이 여러 게이트에 걸린 것'으로
  # 보고 색을 정하기 전에 하나로 합친다. 0이면 비활성.
  min_color_separation_mm: 30.0
  # 로봇 도달 영역(베이스 기준 부채꼴). 밖의 블록은 아예 보고하지 않는다 —
  # 팔이 닿지도 않고, 판 바깥 나무 바닥 같은 잡동사니가 바로 그 유령 후보의
  # 출처다. 관제 화면의 주황 부채꼴이 이 값을 그대로 그리므로, 그려진 것이
  # 곧 검출 범위다. radius 0이면 비활성.
  workspace_radius_mm: 320.0
  workspace_angle_min_deg: -90.0
  workspace_angle_max_deg: 90.0

select:
  rule: nearest_first
  zone_margin_mm: 0.0
  target_cell_mm: 40.0

sensing:
  # 실측 완료 (2026-08-31, tune_gripper_load.py --mode grasp, 6 trials):
  #   잡힘: pos=44.1~44.3  load=500(포화)   빈손: pos=3.4  load=39~41
  # 두 분포가 완전히 분리되어 있어 아래 값은 그 중간으로 넉넉하게 잡음.
  # 명령 가능한 범위는 0~100(서보 캘리브레이션에 기록된 구간의 정규화 값).
  # 기구 자체는 100 너머로도 더 벌어지지만 그 구간은 기록 밖이라 명령하지 않는다.
  # 95는 실제 블록을 넣어보고 충분하다고 확인한 값이며 100까지 5 남긴다.
  gripper_open_pos: 95.0
  gripper_close_pos: 2.0
  # 위치 게이트는 '빈손'을 걸러내는 용도이므로 빈손 분포(3.4)를 기준으로 잡는다.
  # 기존 20.0은 블록이 눕혀진 상태(조우 40mm)와 빈손의 중간값이라, 블록이 세워진
  # 상태(조우 ~20mm)로 잡히면 임계값에 걸쳐서 실제 파지를 EMPTY로 오판했다.
  gripper_empty_closed_max: 12.0
  gripper_load_min: 200.0
  grasp_check_mode: position_and_load
  grasp_settle_s: 0.4
  grasp_samples: 5
  sample_interval_s: 0.05
  contact_joints: [shoulder_lift, elbow_flex]
  contact_load_delta: 80.0
  contact_baseline_samples: 5

motion:
  poses_path: src/configs/poses.yaml
  fps: 30.0
  max_step_per_tick: 2.0
  descent_step_per_tick: 0.6
  arrival_tol: 3.0
  transit_arrival_tol: 8.0
  # 파지 하강 직전 hover 도착 허용오차. descend()가 '측정된' 자세에서 보간하므로
  # 여기서 남은 오차만큼 내려가면서 옆으로 쓸려 블록을 밀어낸다(283mm 반경 실측:
  # 8°→69mm, 3°→29mm, 2°→21mm). 빈 조우라 느슨한 transit 값의 근거가 없다.
  grasp_hover_arrival_tol: 2.0
  # 위 허용오차를 맞추려고 hover에서 더 기다리는 시간 상한. 서보 분해능이
  # 안 되면 못 맞추므로 짧게 끊고 그대로 하강한다 (블록당 시도 5회이므로
  # move_timeout_s를 쓰면 시도마다 수 초씩 죽는다).
  grasp_hover_settle_s: 0.8
  hover_clearance_mm: 120.0
  hover_min_clearance_mm: 40.0
  hover_search_step_mm: 5.0
  transit_apex_radius_mm: 195.0
  move_timeout_s: 10.0
  gripper_action_wait_s: 0.6
  home_pose: home
  retreat_pose: retreat
  transport_waypoints: [zone_approach]
  slot_poses: [slot_0, slot_1, slot_2, slot_3, slot_4]
  tower_approach_pose: tower_approach
  tower_ladder_prefix: tower_descent
  contact_backoff_ticks: 1
  place_settle_s: 0.5
  # grasp point bias in the gripper's own frame (radial = away from the base,
  # tangential = the gripper's own left) -- see MotionConfig
  grasp_radial_offset_mm: 12.0
  # 모든 블록에서 부채꼴 접선 기준 그리퍼 상대 좌측으로 10mm.
  grasp_tangential_offset_mm: 10.0
  # false: 중립 요 기준(반경/접선) — 기존 측정이 모두 이 프레임에서 나옴
  # true : 조우가 블록 면과 평행해진 뒤의 프레임 기준(그리퍼 롤각 반영)
  grasp_offsets_follow_jaw_yaw: false
  left_half_y_mm: 0.0
  left_half_radial_offset_mm: 10.0
  left_half_tangential_offset_mm: 0.0
  # optional ramp on top of the step; OFF by default -- see MotionConfig
  left_ramp_radial_mm_per_100mm: 0.0
  left_ramp_tangential_mm_per_100mm: 0.0
  # (radial, tangential) mm: left, back, right, front — 왼쪽부터 반시계 방향
  # 15mm = 70mm 조우가 40mm 블록 주위에 남기는 한쪽 여유 전부
  grasp_retry_offsets_mm: [[0.0, 15.0], [-15.0, 0.0], [0.0, -15.0], [15.0, 0.0]]
  descent_blocked_tol: 4.0
  descent_max_lag: 8.0
  descent_settle_s: 5.0

ik:
  urdf_path: third_party/so101/so101.urdf
  target_frame: gripper_frame_link
  seed_step_deg: 3.0
  seed_range_deg: 100.0
  seed_tilt_max_deg: 3.0
  seed_cache_path: src/configs/calib/ik_seed_table.npz
  pan_offset_candidates_deg: [0.0, 6.0, -6.0, 12.0, -12.0]
  ik_iters: 8
  # 실측 캘리브레이션 오차(AGENTS.md §6: RMS~10mm, 최악 ~30mm)보다 넉넉하게 잡음 —
  # 이 한계는 "IK가 못 풀었다"를 걸러내는 것이지, 파지 정확도 자체를 보장하지 않음.
  max_position_error_mm: 15.0
  max_tilt_error_deg: 6.0

policy:
  server_address: 127.0.0.1:8080     # Tailscale의 policy_server 주소로 변경
  policy_type: act
  pretrained_name_or_path: ""        # policy_server가 도는 머신 기준 경로
  task: "Pick the nearest block, lift it vertically, and move to the fixed retreat pose."
  policy_device: cuda
  actions_per_chunk: 50
  chunk_size_threshold: 0.5
  aggregate_fn_name: weighted_average
  aggregate_weight: 0.5
  fps: 30.0
  connect_timeout_s: 5.0
  retreat_tol: 4.0
  retreat_hold_ticks: 5
  retreat_check_joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
  pick_timeout_s: 25.0

fsm:
  num_blocks: 5
  time_budget_s: 300.0
  max_retries_per_block: 2
  reserve_time_s: 10.0

task1:
  # HOME에서 fresh frame을 계속 보며 이 시간 동안 외부 블록이 없을 때만 DONE.
  empty_timeout_s: 5.0
  scan_interval_s: 0.2
  max_frame_age_s: 1.0
  # [u, v]: zone 긴 변의 왼쪽->오른쪽, 먼 변->가까운 변. 먼 3개 후 가까운 2개.
  slot_uv: [[0.14, 0.20], [0.50, 0.20], [0.80, 0.20], [0.32, 0.76], [0.68, 0.76]]
  # 모든 슬롯을 실기 under-reach만큼 로봇 기준 바깥 방향으로 20mm 더 멀리 명령.
  slot_radial_offset_mm: [20.0, 20.0, 20.0, 20.0, 20.0]
  # 사선 카메라의 먼 거리 오차 보정: 200mm까지 0, 320mm에서 바깥쪽 +20mm.
  pick_correction_start_radius_mm: 200.0
  pick_correction_max_radius_mm: 320.0
  pick_correction_max_offset_mm: 20.0
  # 원거리에서 wrist_flex 한계를 피하도록 gripper 축을 바깥쪽으로 최대 5도 기울임.
  pick_tilt_start_radius_mm: 280.0
  pick_tilt_max_radius_mm: 320.0
  pick_tilt_max_deg: 5.0
  # 실기 확정 전 가정값. 낮게 놓되 테이블을 누르지 않도록 grasp 평면보다 5mm 위.
  release_clearance_mm: 5.0

logging:
  log_dir: logs/pick_stack
  save_transitions: true

# Operator display only. None of these values are used by SELECT, IK, or the
# robot control loop. The outer arc is a nominal visual guide; TopDownIK stays
# authoritative for the reachability of each concrete grasp.
camera:
  overlay:
    analysis_fps: 5.0
    worker_nice: 10
    opencv_threads: 1
    # 게이트에서 탈락한 근접 후보를 사유와 함께 화면에 표시 (표시 전용)
    report_rejects: true
    # 형상만 여기 있고 반경/각도는 perception.workspace_* 를 그대로 그린다
    workspace_boundary:
      enabled: true
      sample_step_deg: 2.0
