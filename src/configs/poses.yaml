# Named joint poses, recorded on the physical arm:
#
#   python -m tools.record_pose --name home
#
# 필요한 포즈는 home(시작/복귀 자세)뿐이다. 나머지 목표는 IK로 푼다.
#
# 주의: 값은 캘리브레이션 종속 — 재캘리브레이션 후에는 전부 재기록.
# 주의: PoseRegistry.save()는 이 헤더를 보존하지 않는다 — record_pose.py로
#       새 포즈를 저장한 뒤에는 이 주석을 다시 붙여야 한다.
poses:
  home:
    shoulder_pan: 1.055
    shoulder_lift: -92.835
    elbow_flex: 89.319
    wrist_flex: 65.846
    wrist_roll: 5.231
    gripper: 0.482
